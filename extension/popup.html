<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eclipse</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #070B12;
    --surface: #12212B;
    --border: #1E3A4A;
    --accent: #FF6B35;
    --text: #E8F0F2;
    --secondary: #9FB3BC;
    --success: #34D399;
    --warning: #FBBF24;
    --danger: #F87171;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    width: 360px;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
    overflow-x: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }

  .row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }

  .row + .row {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .dot {
    flex: 0 0 auto;
    width: 10px;
    height: 10px;
    margin-top: 5px;
    border-radius: 50%;
    background: var(--secondary);
  }

  .dot[data-state="ok"] { background: var(--success); }
  .dot[data-state="warn"] { background: var(--warning); }
  .dot[data-state="bad"] { background: var(--danger); }
  .dot[data-state="unknown"] { background: var(--secondary); }

  h2 {
    margin: 0;
    font-size: 13px;
    font-weight: 600;
  }

  .row p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--secondary);
  }

  .mono {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
  }

  .token-form {
    margin-top: 12px;
  }

  .token-form > p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--secondary);
  }

  .token-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .token-row input {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  .token-row input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .token-row button {
    flex: 0 0 auto;
    padding: 10px 16px;
  }

  .save-text {
    min-height: 19px;
  }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  button {
    font: inherit;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: filter 120ms ease;
  }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .primary {
    flex: 1;
    padding: 10px 12px;
    background: var(--accent);
    color: var(--bg);
    border: 1px solid transparent;
  }

  .secondary {
    flex: 1;
    padding: 10px 12px;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }

  .ghost {
    padding: 6px 10px;
    font-size: 13px;
    font-weight: 600;
    background: transparent;
    color: var(--secondary);
    border: 1px solid var(--border);
  }

  button:hover { filter: brightness(1.1); }

  button:disabled {
    cursor: default;
    filter: none;
    opacity: 0.6;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition: none !important;
      animation: none !important;
    }
  }

  @media (forced-colors: active) {
    .card, .secondary, .ghost { border-color: ButtonText; }
    .dot { border: 1px solid CanvasText; }
    .primary { border: 1px solid ButtonText; }
  }
</style>
</head>
<body>
  <header>
    <h1>Eclipse</h1>
    <button id="refresh" class="ghost" type="button">Refresh</button>
  </header>

  <section class="card" aria-label="Eclipse status" aria-live="polite">
    <div class="row">
      <span id="server-dot" class="dot" data-state="unknown" aria-hidden="true"></span>
      <div>
        <h2>Local server</h2>
        <p id="server-text">Checking&hellip;</p>
      </div>
    </div>
    <div class="row">
      <span id="token-dot" class="dot" data-state="unknown" aria-hidden="true"></span>
      <div>
        <h2>Server token</h2>
        <p id="token-text">Checking&hellip;</p>
      </div>
    </div>
    <div class="row">
      <span id="task-dot" class="dot" data-state="unknown" aria-hidden="true"></span>
      <div>
        <h2>Current task</h2>
        <p id="task-text">No task running</p>
      </div>
    </div>
  </section>

  <section class="card token-form" aria-label="Save server token">
    <h2>Server token</h2>
    <p>Paste the token from <span class="mono">data/.eclipse-token</span> on the
    server &mdash; the same token the workspace asks for. It is stored only in
    this browser and never shown again.</p>
    <div class="token-row">
      <input id="token-input" type="password" autocomplete="off" spellcheck="false"
             placeholder="Paste token&hellip;" aria-label="Server token">
      <button id="save-token" class="primary" type="button">Save</button>
    </div>
    <p id="token-save-text" class="save-text" aria-live="polite"></p>
  </section>

  <div class="actions">
    <button id="open-workspace" class="primary" type="button">Open workspace</button>
    <button id="open-proof" class="secondary" type="button">View proof</button>
  </div>

  <script type="module" src="./dist/popup.js"></script>
</body>
</html>
